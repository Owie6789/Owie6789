name: Age Updater
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Update age and README
        run: |
          YEAR=$(date +%Y)
          MONTH=$(date +%-m)
          DAY=$(date +%-d)

          AGE=$((YEAR - 2009))
          if [ "$MONTH" -le 11 ] || { [ "$MONTH" -eq 12 ] && [ "$DAY" -lt 24 ]; }; then
            AGE=$((AGE - 1))
          fi

          echo "Age: $AGE"

          sed -i "s/16+and+shipping/${AGE}+and+shipping/g" README.md

          if [ "$MONTH" -eq 12 ] && [ "$DAY" -eq 24 ]; then
            sed -i "s|lines=dev|lines=today%27s+my+birthday+%F0%9F%8E%82;dev|" README.md
          fi

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          if ! git diff --staged --quiet; then
            git commit -m "chore: update age"
            git push
          else
            echo "No changes"
          fi
name: Update Age
on:
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update-age:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Calculate age and update README
        run: |
          BIRTH_YEAR=2009
          BIRTH_MONTH=12
          BIRTH_DAY=24

          CURRENT_YEAR=$(date +%Y)
          CURRENT_MONTH=$(date +%-m)
          CURRENT_DAY=$(date +%-d)

          if [ "$CURRENT_MONTH" -gt "$BIRTH_MONTH" ] || { [ "$CURRENT_MONTH" -eq "$BIRTH_MONTH" ] && [ "$CURRENT_DAY" -ge "$BIRTH_DAY" ]; }; then
            AGE=$((CURRENT_YEAR - BIRTH_YEAR))
          else
            AGE=$((CURRENT_YEAR - BIRTH_YEAR - 1))
          fi

          echo "Age calculated: $AGE"

          IS_BIRTHDAY=0
          [ "$CURRENT_MONTH" -eq 12 ] && [ "$CURRENT_DAY" -eq 24 ] && IS_BIRTHDAY=1

          python3 << 'PYEOF'
import re, os

with open("README.md", "r") as f:
    content = f.read()

age = int(os.environ.get("AGE", "16"))
is_birthday = os.environ.get("IS_BIRTHDAY", "0") == "1"

content = re.sub(
    r'(lines=dev.*?;building\+stuff\+that\+works\+offline;)\d+(\+and\+shipping)',
    rf'\g<1>{age}\g<2>',
    content
)

if is_birthday:
    birthday_line = "today%27s+my+birthday+%F0%9F%8E%82"
    content = re.sub(
        r'(lines=)(dev.*?;building\+stuff\+that\+works\+offline;\d+\+and\+shipping)',
        rf'\g<1>{birthday_line};\g<2>',
        content
    )

with open("README.md", "w") as f:
    f.write(content)
print("README.md updated")
PYEOF
        env:
          AGE: $AGE
          IS_BIRTHDAY: $IS_BIRTHDAY

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          AGE_VAL=$(python3 -c "
import datetime
b = datetime.date(2009, 12, 24)
t = datetime.date.today()
print(t.year - b.year - (1 if (t.month, t.day) < (b.month, b.day) else 0))
")
          git diff --staged --quiet || git commit -m "chore: update age to $AGE_VAL"
          git push